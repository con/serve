# -- Site Configuration --
# https://jpanther.github.io/congo/docs/getting-started/

theme = "congo"
baseURL = "https://con.github.io/serve/"
defaultContentLanguage = "en"

enableRobotsTXT = true
summaryLength = 0

[pagination]
  pagerSize = 20

[outputs]
  home = ["HTML", "RSS", "JSON"]

[privacy]
  [privacy.youTube]
    privacyEnhanced = true

[taxonomies]
  category = "categories"
  tag = "tags"
  media_type = "media_types"
  integration = "integrations"
  ai_readiness = "ai_readiness"
  standard = "standards"

# Agent definitions live in .claude/agents/ (single source of truth) and are
# published under /concepts/agents/. Hugo does not follow symlinks in
# content/, so mount the directory instead.
[module]
  [[module.mounts]]
    source = "content"
    target = "content"
  [[module.mounts]]
    source = ".claude/agents"
    target = "content/concepts/agents"
    excludeFiles = ["README.md"]
